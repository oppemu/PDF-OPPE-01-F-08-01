<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบดาวน์โหลด PDF จาก Google Sheets</title>
    <!-- ใช้ Bootstrap และ Font เหมือนเดิม -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600&family=TH+Sarabun+New&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="report_letter.css?v=1.3.0">

</head>
<body>
    <div class="container main-container mt-5 mb-5">
        
        <!-- ส่วนหัว (Logo + ช่องค้นหา) ย้ายมาใส่ในกรอบ (Card) เดียวกัน -->
        <div class="header-card">
            <div class="text-center mb-4">
                <!-- เปลี่ยนใช้ LOGO_2.png -->
                <img src="LOGO.png" alt="โลโก้กองกายภาพและสิ่งแวดล้อม" class="header-logo">
            </div>
            
            <div class="search-container text-center">
                <label for="searchName" class="form-label d-block text-muted"></label>
                <div class="input-group search-group mx-auto">
                    <!-- เพิ่มปุ่มค้นหาและ id สำหรับให้ JavaScript เรียกใช้ -->
                    <input type="text" id="searchName" class="form-control form-control-lg" placeholder="พิมพ์ชื่อเพื่อค้นหาเอกสารของคุณ" aria-label="ค้นหาชื่อ">
                    <button class="btn btn-mahidol px-4" type="button" id="btnSearch">ค้นหา</button>
                </div>
            </div>
        </div>

        <!-- รายการเอกสาร -->
        <div class="content-box">
            <h5 class="box-title"></h5>
            
            <div id="loading" class="text-center py-4 text-muted">
                กำลังดึงข้อมูลจากฐานข้อมูล...
            </div>
            
            <div id="docList" style="display:none; flex-direction: column; gap: 15px;"></div>
        </div>
    </div>

    <!-- Modal พรีวิวเอกสาร -->
    <div class="modal fade" id="pdfPreviewModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" style="color: #00246B; font-weight: 600;">ตัวอย่างเอกสาร</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body bg-light">
            <h6 class="letter-preview-heading">เอกสารที่ 1: รายงานผลการตรวจสอบการส่งมอบงาน</h6>
            <div id="letterNotice" class="letter-preview-notice"></div>
            <div id="pdfFilenameHint" style="font-size:13px;overflow-wrap:anywhere;margin-bottom:8px;"></div>
            <div class="pdf-editor-toolbar">
                <button type="button" id="btnReflowPdf" class="btn btn-outline-primary btn-sm" onclick="reflowDocumentPreview()">จัดหน้าใหม่</button>
                <button type="button" id="btnResetPdf" class="btn btn-outline-secondary btn-sm" onclick="resetDocumentEdits()">คืนค่าต้นฉบับ</button>
                <span id="editorStatus" role="status" aria-live="polite"></span>
            </div>
            <div id="letterPreview" class="letter-preview-scroll"></div>
            <h6 class="letter-preview-heading">เอกสารที่ 2: แบบฟอร์มเดิม</h6>
            <div class="legacy-preview-scroll" id="previewContent"></div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary rounded-pill px-4" data-bs-dismiss="modal">ปิด</button>
            <button type="button" class="btn btn-mahidol rounded-pill px-4" id="btnConfirmDownload" onclick="downloadPdfFromPreview()">
                ดาวน์โหลด PDF
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="config.js"></script>
    <script src="report_contacts.js"></script>
    <script src="report_letter.js?v=1.3.0"></script>
    <script src="report_editor.js"></script>
    <script src="script.js?v=1.3.0"></script>
</body>
</html>
